[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data360-agent-governance"
version = "0.1.0"
description = "Governance tooling for AI agents on Salesforce Data 360"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "salesforce-datacloud-connector>=2.0.0b1",
    "python-dotenv",
]

[project.scripts]
data360-agent-governance = "data360_agent_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100